<div class="check-availability">
    <h2>Check Availability</h2>
    <form id="check-availability-form" action="hotel_cart.html" method="post">
      <div class="form-group">
        <label for="check-in-date">Check-In Date:</label>
        <input type="date" id="check-in-date" name="check-in-date" required>
      </div>
      <div class="form-group">
        <label for="check-out-date">Check-Out Date:</label>
        <input type="date" id="check-out-date" name="check-out-date" required>
      </div>
      <div class="form-group">
        <label for="guests">Guests:</label>
        <input type="number" id="guests" name="guests" min="1" required>
      </div>
      <div class="form-group">
        <label for="rooms">Rooms:</label>
        <select id="rooms" name="rooms">
          <option value="standard">Standard Room</option>
          <option value="deluxe city">Deluxe City View Room</option>
          <option value="deluxe family">Deluxe Family Room</option>
          <option value="Luxury">Luxury Room</option>
          <option value="Deluxe Seaview">Deluxe Seaview</option>
          <option value="Premier Seaview">Premier Sea</option>
        </select>
      </div>      
      <div class="form-group">
       <button type="submit">Check Availability</button>
      </div>
    </form>
